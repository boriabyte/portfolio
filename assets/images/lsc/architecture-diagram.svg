<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Romanian grammatical error correction pipeline</title>
<desc>Data preparation with ERRANT and lexicon reclassification produces tag sequences, which are used to fine-tune a Romanian BERT tagger. At inference, the tagger predicts a tag per token, a confidence threshold filters the predictions, edits are applied, and the process repeats for up to three passes.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bg { fill: none; }
  .zone { fill: none; stroke: #8A887F; stroke-width: 1; stroke-dasharray: 4 4; }
  .lbl { font-size: 14px; font-weight: 600; fill: #C9C7BD; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 12px; font-weight: 400; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .teal .h { fill: #085041; }
  .teal .s { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .purple .h { fill: #3C3489; }
  .purple .s { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
  .gray .h { fill: #444441; }
  .gray .s { fill: #5F5E5A; }
  .inf .h { font-size: 13px; }
  .arr { stroke: #9a9a9a; stroke-width: 1.5; fill: none; }
  .note { font-size: 12px; fill: #9a9a9a; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="679" height="469" rx="12"/>

<rect class="zone" x="20" y="24" width="640" height="104" rx="12"/>
<text class="lbl" x="36" y="42" dominant-baseline="central">Data preparation</text>
<g class="teal">
  <rect x="40" y="58" width="130" height="56" rx="8"/>
  <text class="h" x="105" y="78" text-anchor="middle" dominant-baseline="central">Parallel data</text>
  <text class="s" x="105" y="96" text-anchor="middle" dominant-baseline="central">1.18M pairs</text>
</g>
<g class="teal">
  <rect x="196" y="58" width="130" height="56" rx="8"/>
  <text class="h" x="261" y="78" text-anchor="middle" dominant-baseline="central">ERRANT</text>
  <text class="s" x="261" y="96" text-anchor="middle" dominant-baseline="central">29 error types</text>
</g>
<g class="teal">
  <rect x="352" y="58" width="130" height="56" rx="8"/>
  <text class="h" x="417" y="78" text-anchor="middle" dominant-baseline="central">Reclassify</text>
  <text class="s" x="417" y="96" text-anchor="middle" dominant-baseline="central">Rules + lexicon</text>
</g>
<g class="teal">
  <rect x="508" y="58" width="130" height="56" rx="8"/>
  <text class="h" x="573" y="78" text-anchor="middle" dominant-baseline="central">Tag sequences</text>
  <text class="s" x="573" y="96" text-anchor="middle" dominant-baseline="central">3,702 tags</text>
</g>
<line class="arr" x1="172" y1="86" x2="194" y2="86" marker-end="url(#arrow)"/>
<line class="arr" x1="328" y1="86" x2="350" y2="86" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="86" x2="506" y2="86" marker-end="url(#arrow)"/>
<line class="arr" x1="573" y1="114" x2="573" y2="168" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="40" y="170" width="600" height="56" rx="8"/>
  <text class="h" x="340" y="190" text-anchor="middle" dominant-baseline="central">Fine-tune Romanian BERT</text>
  <text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">Frozen encoder, then full model</text>
</g>
<line class="arr" x1="215" y1="226" x2="215" y2="322" marker-end="url(#arrow)"/>

<rect class="zone" x="20" y="286" width="640" height="160" rx="12"/>
<text class="lbl" x="36" y="304" dominant-baseline="central">Inference</text>
<g class="inf">
<g class="gray">
  <rect x="40" y="324" width="100" height="56" rx="8"/>
  <text class="h" x="90" y="344" text-anchor="middle" dominant-baseline="central">Input</text>
  <text class="s" x="90" y="362" text-anchor="middle" dominant-baseline="central">raw sentence</text>
</g>
<g class="purple">
  <rect x="165" y="324" width="100" height="56" rx="8"/>
  <text class="h" x="215" y="344" text-anchor="middle" dominant-baseline="central">BERT tagger</text>
  <text class="s" x="215" y="362" text-anchor="middle" dominant-baseline="central">tag per token</text>
</g>
<g class="purple">
  <rect x="290" y="324" width="100" height="56" rx="8"/>
  <text class="h" x="340" y="344" text-anchor="middle" dominant-baseline="central">Threshold</text>
  <text class="s" x="340" y="362" text-anchor="middle" dominant-baseline="central">p ≥ 0.7</text>
</g>
<g class="purple">
  <rect x="415" y="324" width="100" height="56" rx="8"/>
  <text class="h" x="465" y="344" text-anchor="middle" dominant-baseline="central">Apply edits</text>
  <text class="s" x="465" y="362" text-anchor="middle" dominant-baseline="central">edit tokens</text>
</g>
<g class="gray">
  <rect x="540" y="324" width="100" height="56" rx="8"/>
  <text class="h" x="590" y="344" text-anchor="middle" dominant-baseline="central">Output</text>
  <text class="s" x="590" y="362" text-anchor="middle" dominant-baseline="central">fixed text</text>
</g>
</g>
<line class="arr" x1="142" y1="352" x2="163" y2="352" marker-end="url(#arrow)"/>
<line class="arr" x1="267" y1="352" x2="288" y2="352" marker-end="url(#arrow)"/>
<line class="arr" x1="392" y1="352" x2="413" y2="352" marker-end="url(#arrow)"/>
<line class="arr" x1="517" y1="352" x2="538" y2="352" marker-end="url(#arrow)"/>
<path class="arr" d="M465 380 L465 410 L215 410 L215 384" marker-end="url(#arrow)"/>
<text class="note" x="340" y="430" text-anchor="middle" dominant-baseline="central">Repeat up to 3 passes, stop when unchanged</text>
</svg>
