<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="856" viewBox="0 0 680 856" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dual-input CNN, BiLSTM and attention architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="190" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#1D9E75">Main branch</text>
<text x="520" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#D85A30">Logic branch</text>
<rect x="40" y="50" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Main input</text>
<text x="190.0" y="88" text-anchor="middle" font-size="12" fill="#0F6E56">20 frames × 93 features</text>
<rect x="40" y="136" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Conv1D 64, k=3, ReLU</text>
<text x="190.0" y="178" text-anchor="middle" font-size="12" fill="#0F6E56">BN + Dropout 0.3 + MaxPool 2</text>
<rect x="40" y="226" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Conv1D 128, k=3, ReLU</text>
<text x="190.0" y="268" text-anchor="middle" font-size="12" fill="#0F6E56">BN + Dropout 0.3 + MaxPool 2</text>
<rect x="40" y="316" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">BiLSTM</text>
<text x="190.0" y="358" text-anchor="middle" font-size="12" fill="#0F6E56">128 units × 2 directions</text>
<rect x="40" y="406" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Attention</text>
<text x="190.0" y="448" text-anchor="middle" font-size="12" fill="#0F6E56">Weighted sum over time</text>
<rect x="400" y="50" width="240" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="520.0" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#712B13">Logic input</text>
<text x="520.0" y="88" text-anchor="middle" font-size="12" fill="#993C1D">20 frames × 14 features</text>
<rect x="400" y="316" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="520.0" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#712B13">BiLSTM</text>
<text x="520.0" y="358" text-anchor="middle" font-size="12" fill="#993C1D">128 units × 2 directions</text>
<rect x="400" y="406" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="520.0" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#712B13">Attention</text>
<text x="520.0" y="448" text-anchor="middle" font-size="12" fill="#993C1D">Weighted sum over time</text>
<rect x="240" y="506" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="531" text-anchor="middle" font-size="14" font-weight="700" fill="#444441">Concatenate</text>
<text x="340.0" y="544" text-anchor="middle" font-size="12" fill="#5F5E5A">256 + 256 = 512</text>
<rect x="180" y="592" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="617" text-anchor="middle" font-size="14" font-weight="700" fill="#444441">Dense 256 + ReLU + Dropout 0.4</text>
<text x="340.0" y="634" text-anchor="middle" font-size="12" fill="#5F5E5A">512 → 256</text>
<rect x="180" y="682" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="707" text-anchor="middle" font-size="14" font-weight="700" fill="#444441">Dense N + softmax</text>
<text x="340.0" y="724" text-anchor="middle" font-size="12" fill="#5F5E5A">L2 regularization 1e-4</text>
<rect x="210" y="772" width="260" height="44" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="799.0" text-anchor="middle" font-size="14" font-weight="700" fill="#444441">Output: class probabilities</text>
