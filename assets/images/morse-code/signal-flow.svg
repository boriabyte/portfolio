<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img">
<title>Morse code player signal flow</title>
<desc>Text typed into the serial console at 115200 baud is read one character at a time by loop(). Each character is dispatched to a pattern function that composes dots, dashes and pauses and drives the piezo buzzer on GPIO 18 through Tone32. In the same pass the character is echoed to the serial console, the LCD is cleared, and the text still waiting in the serial buffer is written to the 16x2 I2C LCD.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bg { fill: none; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 12px; font-weight: 400; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .teal .h { fill: #085041; }
  .teal .s { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .purple .h { fill: #3C3489; }
  .purple .s { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
  .gray .h { fill: #444441; }
  .gray .s { fill: #5F5E5A; }
  .arr { stroke: #9a9a9a; stroke-width: 1.5; fill: none; }
  .lbl { font-size: 13px; font-weight: 600; fill: #C9C7BD; }
  .note { font-size: 12px; fill: #9a9a9a; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="679" height="289" rx="12"/>

<g class="gray">
  <rect x="20" y="108" width="120" height="64" rx="8"/>
  <text class="h" x="80" y="130" text-anchor="middle" dominant-baseline="central">Serial console</text>
  <text class="s" x="80" y="150" text-anchor="middle" dominant-baseline="central">115200 baud</text>
</g>
<g class="gray">
  <rect x="170" y="108" width="140" height="64" rx="8"/>
  <text class="h" x="240" y="130" text-anchor="middle" dominant-baseline="central">loop()</text>
  <text class="s" x="240" y="150" text-anchor="middle" dominant-baseline="central">one char per pass</text>
</g>
<line class="arr" x1="142" y1="140" x2="168" y2="140" marker-end="url(#arrow)"/>
<path class="arr" d="M310 140 H326 V72 H338" marker-end="url(#arrow)"/>
<path class="arr" d="M310 140 H326 V208 H338" marker-end="url(#arrow)"/>

<text class="lbl" x="340" y="28" dominant-baseline="central">Audio path</text>
<g class="teal">
  <rect x="340" y="40" width="150" height="64" rx="8"/>
  <text class="h" x="415" y="62" text-anchor="middle" dominant-baseline="central">Pattern function</text>
  <text class="s" x="415" y="82" text-anchor="middle" dominant-baseline="central">dots, dashes, pauses</text>
</g>
<g class="teal">
  <rect x="510" y="40" width="150" height="64" rx="8"/>
  <text class="h" x="585" y="62" text-anchor="middle" dominant-baseline="central">Piezo buzzer</text>
  <text class="s" x="585" y="82" text-anchor="middle" dominant-baseline="central">GPIO 18 &#183; 1 kHz</text>
</g>
<line class="arr" x1="492" y1="72" x2="508" y2="72" marker-end="url(#arrow)"/>

<text class="lbl" x="340" y="164" dominant-baseline="central">Display path</text>
<g class="purple">
  <rect x="340" y="176" width="150" height="64" rx="8"/>
  <text class="h" x="415" y="198" text-anchor="middle" dominant-baseline="central">Echo + clear</text>
  <text class="s" x="415" y="218" text-anchor="middle" dominant-baseline="central">serial echo, lcd.clear()</text>
</g>
<g class="purple">
  <rect x="510" y="176" width="150" height="64" rx="8"/>
  <text class="h" x="585" y="198" text-anchor="middle" dominant-baseline="central">16&#215;2 LCD</text>
  <text class="s" x="585" y="218" text-anchor="middle" dominant-baseline="central">I2C &#183; 0x27</text>
</g>
<line class="arr" x1="492" y1="208" x2="508" y2="208" marker-end="url(#arrow)"/>

<text class="note" x="340" y="268" text-anchor="middle" dominant-baseline="central">Both paths run inside the same loop() pass: the character is played first, then the display is updated.</text>
</svg>
